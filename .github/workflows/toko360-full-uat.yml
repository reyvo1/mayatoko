name: Toko360 Full Automated UAT

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: toko360-full-uat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-uat:
    name: Build + Browser + PostgreSQL Release Gates
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: toko360_ci_password
          POSTGRES_DB: toko360_staging
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d toko360_staging"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      CI: "true"
      NODE_ENV: test

      DATABASE_PROFILE: postgresql
      DATABASE_URL: postgresql://postgres:toko360_ci_password@127.0.0.1:5432/toko360_staging

      T360_UAT_ENVIRONMENT: GITHUB_UAT
      T360_UAT_ADMIN_EMAIL: admin@toko360.local
      T360_UAT_ADMIN_PASSWORD: Admin123!
      T360_UAT_EXPECTED_HOST: 127.0.0.1
      T360_UAT_EXPECTED_DATABASE: toko360_staging

      T360_ALLOW_PRESERVE_ARTIFACT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install PostgreSQL client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Resolve Chromium
        id: chromium
        shell: bash
        run: |
          set -euo pipefail

          CHROME=""
          for candidate in \
            "$(command -v google-chrome || true)" \
            "$(command -v google-chrome-stable || true)" \
            "$(command -v chromium || true)" \
            "$(command -v chromium-browser || true)"
          do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              CHROME="$candidate"
              break
            fi
          done

          if [ -z "$CHROME" ]; then
            sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
            CHROME="$(command -v chromium-browser || command -v chromium)"
          fi

          echo "T360_CHROMIUM=$CHROME" >> "$GITHUB_ENV"
          echo "chromium=$CHROME" >> "$GITHUB_OUTPUT"
          "$CHROME" --version

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Prepare CI databases and UAT env files
        shell: bash
        run: |
          set -euo pipefail

          export PGPASSWORD=toko360_ci_password

          psql \
            -h 127.0.0.1 \
            -U postgres \
            -d postgres \
            -v ON_ERROR_STOP=1 \
            -c 'DROP DATABASE IF EXISTS toko360_stage18_restore;' \
            -c 'CREATE DATABASE toko360_stage18_restore;'

          node scripts/prepare-github-uat-env.mjs

      - name: Sync PostgreSQL schema
        id: schema
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs/github-uat
          npm run prisma:push:postgres -w @toko360/api 2>&1 | tee logs/github-uat/10-prisma-push.log

      - name: Seed PostgreSQL staging
        id: seed
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/prepare-github-uat-env.mjs --seed 2>&1 | tee logs/github-uat/20-seed.log

      - name: Build gate
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build:gate 2>&1 | tee logs/github-uat/30-build-gate.log

      - name: Browser UAT
        id: browser
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/browser-uat.mjs 2>&1 | tee logs/github-uat/40-browser-uat.log

      - name: Built Browser UAT
        id: built_browser
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run uat:browser:built 2>&1 | tee logs/github-uat/50-built-browser-uat.log

      - name: Stage 18 ownership / restore
        id: stage18
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run db:ownership:stage:postgres 2>&1 | tee logs/github-uat/60-stage18.log

      - name: Stage 19 tenant integration
        id: stage19
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:tenant:staging:artifact 2>&1 | tee logs/github-uat/70-stage19.log

      - name: Payroll adjustment staging
        id: payroll
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run db:payroll-adjustment:stage:postgres:artifact 2>&1 | tee logs/github-uat/80-payroll.log

      - name: Stage 20 automated readiness
        id: stage20
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p logs/github-uat

          npm run release:readiness:staging:artifact 2>&1 | tee logs/github-uat/90-stage20.log
          code=${PIPESTATUS[0]}

          echo "$code" > logs/github-uat/stage20-exit-code.txt

          if [ "$code" -eq 0 ]; then
            echo "stage20_mode=FULL_PASS" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$code" -eq 2 ]; then
            echo "stage20_mode=AUTOMATED_PASS_HUMAN_UAT_PENDING" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "stage20_mode=FAILED" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: UAT candidate verifier
        id: candidate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run uat:candidate:verify 2>&1 | tee logs/github-uat/100-uat-candidate.log

      - name: Build GitHub UAT report
        if: always()
        shell: bash
        env:
          STEP_SCHEMA: ${{ steps.schema.outcome }}
          STEP_SEED: ${{ steps.seed.outcome }}
          STEP_BUILD: ${{ steps.build.outcome }}
          STEP_BROWSER: ${{ steps.browser.outcome }}
          STEP_BUILT_BROWSER: ${{ steps.built_browser.outcome }}
          STEP_STAGE18: ${{ steps.stage18.outcome }}
          STEP_STAGE19: ${{ steps.stage19.outcome }}
          STEP_PAYROLL: ${{ steps.payroll.outcome }}
          STEP_STAGE20: ${{ steps.stage20.outcome }}
          STAGE20_MODE: ${{ steps.stage20.outputs.stage20_mode }}
          STEP_CANDIDATE: ${{ steps.candidate.outcome }}
        run: node scripts/github-uat-report.mjs

      - name: Publish job summary
        if: always()
        shell: bash
        run: |
          if [ -f logs/github-uat/summary.md ]; then
            cat logs/github-uat/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "GitHub UAT summary file tidak terbentuk." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload UAT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toko360-full-uat-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            logs/
            handoff/quality/
            work-items/generated/
            stage20-uat-results.json
            stage18-ownership-decisions.json

      - name: Enforce automated UAT result
        if: always()
        shell: bash
        env:
          STEP_SCHEMA: ${{ steps.schema.outcome }}
          STEP_SEED: ${{ steps.seed.outcome }}
          STEP_BUILD: ${{ steps.build.outcome }}
          STEP_BROWSER: ${{ steps.browser.outcome }}
          STEP_BUILT_BROWSER: ${{ steps.built_browser.outcome }}
          STEP_STAGE18: ${{ steps.stage18.outcome }}
          STEP_STAGE19: ${{ steps.stage19.outcome }}
          STEP_PAYROLL: ${{ steps.payroll.outcome }}
          STEP_STAGE20: ${{ steps.stage20.outcome }}
          STAGE20_MODE: ${{ steps.stage20.outputs.stage20_mode }}
        run: |
          set -euo pipefail

          failed=0

          check() {
            local name="$1"
            local value="$2"

            if [ "$value" != "success" ]; then
              echo "::error::$name = $value"
              failed=1
            fi
          }

          check "PostgreSQL schema" "$STEP_SCHEMA"
          check "PostgreSQL seed" "$STEP_SEED"
          check "Build gate" "$STEP_BUILD"
          check "Browser UAT" "$STEP_BROWSER"
          check "Built Browser UAT" "$STEP_BUILT_BROWSER"
          check "Stage 18" "$STEP_STAGE18"
          check "Stage 19" "$STEP_STAGE19"
          check "Payroll staging" "$STEP_PAYROLL"
          check "Stage 20 automated" "$STEP_STAGE20"

          if [ "${STAGE20_MODE:-}" = "FAILED" ] || [ -z "${STAGE20_MODE:-}" ]; then
            echo "::error::Stage-20 automated readiness belum PASS."
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            echo "Automated UAT FAILED. Download artifact toko360-full-uat-${{ github.run_id }} untuk evidence."
            exit 1
          fi

          echo "Automated UAT PASS."
          echo "Human Stage-20 UAT tetap terpisah dan tidak diubah otomatis."
